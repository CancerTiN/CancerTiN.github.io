<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">从 Google Cloud 到 Pi 的连接准备</title>
  <desc id="desc">先准备 Google Cloud 项目、账单和 Vertex AI API，再用本机 ADC 完成 Google 身份认证。凭据文件留在本机。项目中的 Pi 加载 .pi/SYSTEM.md 与 skills，通过 google-vertex 在 global 调用 gemini-4-argon，随后开始写作。箭头表示准备顺序。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" stroke="#1f4f82" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="640" height="660" rx="18" fill="#f3f7f7"/>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">
    <rect x="24" y="24" width="592" height="148" rx="14" fill="#e6edef" stroke="#d3dee2"/>
    <circle cx="60" cy="65" r="19" fill="#1f4f82"/>
    <text x="60" y="73" text-anchor="middle" font-size="23" font-weight="600" fill="#fff">1</text>
    <text x="94" y="75" font-size="30" font-weight="600" fill="#141b2d">Google Cloud</text>
    <text x="94" y="117" font-size="25" fill="#4e5a6e">准备项目、账单并启用 API</text>
    <text x="94" y="152" font-size="25" fill="#4e5a6e">Vertex AI / Agent Platform</text>
    <path d="M320 181V202" stroke="#1f4f82" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="24" y="212" width="592" height="148" rx="14" fill="#fff" stroke="#d3dee2"/>
    <circle cx="60" cy="253" r="19" fill="#1f4f82"/>
    <text x="60" y="261" text-anchor="middle" font-size="23" font-weight="600" fill="#fff">2</text>
    <text x="94" y="263" font-size="30" font-weight="600" fill="#141b2d">本机 · ADC</text>
    <text x="94" y="305" font-size="25" fill="#4e5a6e">完成 Google 身份认证</text>
    <text x="94" y="340" font-size="25" fill="#1f4f82">凭据文件留在本机</text>
    <path d="M320 369V390" stroke="#1f4f82" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="24" y="400" width="592" height="236" rx="14" fill="#13203f"/>
    <circle cx="60" cy="441" r="19" fill="#f1ebdc"/>
    <text x="60" y="449" text-anchor="middle" font-size="23" font-weight="600" fill="#13203f">3</text>
    <text x="94" y="451" font-size="30" font-weight="600" fill="#f1ebdc">项目 · Pi</text>
    <text x="94" y="495" font-size="25" fill="#dce3ee">加载 .pi/SYSTEM.md 与 skills</text>
    <text x="94" y="535" font-size="25" fill="#dce3ee">google-vertex → 云端模型</text>
    <text x="94" y="575" font-size="25" fill="#dce3ee">global · gemini-4-argon</text>
    <text x="94" y="615" font-size="25" fill="#a5c8e9">开始写作</text>
  </g>
</svg>
